<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reminder Board TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101113;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}main{max-width:1600px;margin:0 auto;padding:4vw 5vw 6vw}.top{text-align:center;padding:2vh 0 5vh;border-bottom:1px solid #333}#clock{font-size:11vw;font-weight:300;letter-spacing:-.05em}#date{font-size:2.8vw;color:#aaa;margin-top:12px}.group{margin-top:3vw}.group h2{font-size:1.6vw;font-weight:500;letter-spacing:.14em;color:#aaa;text-transform:uppercase;margin:0 0 14px}.item{display:table;width:100%;border-top:1px solid #303135;padding:1.4vw 0;font-size:2.4vw}.item:last-child{border-bottom:1px solid #303135}.dot{display:table-cell;width:26px;vertical-align:middle}.dot span{display:block;width:9px;height:9px;border-radius:50%;background:#aaa}.School .dot span{background:#80adff}.Extracurricular .dot span{background:#92d6b0}.Other .dot span{background:#f0c38a}.content{display:table-cell;vertical-align:middle;overflow-wrap:break-word}.content small{display:block;color:#aaa;font-size:.56em;margin-top:6px}#status{text-align:center;color:#999;font-size:13px;margin:20px auto}#loginBox{max-width:480px;margin:45px auto;padding:20px;border:1px solid #444;border-radius:12px}#loginBox p{color:#aaa;font-size:14px;line-height:1.5}label{display:block;margin:14px 0;color:#aaa}input{display:block;width:100%;padding:12px;margin-top:7px;background:#17191d;border:1px solid #555;color:white;font-size:17px}button{background:#eee;color:#111;border:0;padding:12px 20px;font-size:16px;cursor:pointer}#error{color:#ffaaaa}#logout{float:right;background:#222;color:#aaa;font-size:12px;padding:6px 10px}body.ready #loginBox{display:none}body.ready #status{display:none}body:not(.ready) #logout{display:none}@media(max-width:650px){#clock{font-size:64px}#date{font-size:20px}.group h2{font-size:15px}.item{font-size:21px;padding:16px 0}}
</style></head><body><main><button id="logout" onclick="logout()">Sign out</button><div class="top"><div id="clock">--:--</div><div id="date">Loading...</div></div><div id="status">Connecting...</div><div id="loginBox" style="display:none"><h2>TV sign in</h2><p>Sign in once with the same Firebase account as your phone. The TV will remember your session.</p><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button onclick="login()">Sign in</button><p id="error"></p></div><div id="board"></div></main>
<script>
// Lightweight, older-browser-friendly TV viewer. No Firebase SDK or JS modules.
var API_KEY='AIzaSyBe2n9ntumyY24juQQhccV-kuYuHr-b0o4';
var DB='https://minimal-reminder-board-default-rtdb.asia-southeast1.firebasedatabase.app';
var accessToken='',refreshToken='',expiresAt=0,pollTimer=null;
function el(id){return document.getElementById(id)}
function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function req(method,url,data,callback){var x=new XMLHttpRequest();x.open(method,url,true);x.timeout=15000;x.onreadystatechange=function(){if(x.readyState===4){var result=null;try{result=JSON.parse(x.responseText)}catch(e){}callback(x.status,result)}};x.ontimeout=function(){callback(0,null)};x.onerror=function(){callback(0,null)};if(data){x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify(data))}else{x.send()}}
function setStatus(s){el('status').textContent=s}
function showLogin(msg){document.body.className='';el('loginBox').style.display='block';el('error').textContent=msg||'';setStatus('Sign in to load reminders')}
function ready(){document.body.className='ready';el('loginBox').style.display='none';el('password').value=''}
function storeSession(r){accessToken=r.idToken||r.id_token;refreshToken=r.refreshToken||r.refresh_token;expiresAt=Date.now()+(Number(r.expiresIn||r.expires_in||3600)-120)*1000;try{localStorage.setItem('tv_refresh_token',refreshToken)}catch(e){}ready();loadReminders()}
function login(){el('error').textContent='Signing in...';req('POST','https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(API_KEY),{email:el('email').value,password:el('password').value,returnSecureToken:true},function(status,r){if(status===200&&r&&r.idToken){storeSession(r)}else{showLogin('Sign-in failed. Check your email and password.')}})}
function refresh(){if(!refreshToken){showLogin('');return}var x=new XMLHttpRequest();x.open('POST','https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(API_KEY),true);x.timeout=15000;x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');x.onreadystatechange=function(){if(x.readyState===4){var r;try{r=JSON.parse(x.responseText)}catch(e){}if(x.status===200&&r&&r.id_token){storeSession(r)}else{showLogin('Session expired. Please sign in again.')}}};x.onerror=function(){setStatus('Connection unavailable. Retrying...');setTimeout(refresh,10000)};x.send('grant_type=refresh_token&refresh_token='+encodeURIComponent(refreshToken))}
function loadReminders(){if(!accessToken)return;if(Date.now()>expiresAt){refresh();return}req('GET',DB+'/boards/main/reminders.json?auth='+encodeURIComponent(accessToken),null,function(status,r){if(status===200){render(r||{});ready()}else if(status===401||status===403){refresh();return}else{setStatus('Connection interrupted. Retrying...');document.body.className=''}scheduleNext()})}
function scheduleNext(){if(pollTimer)clearTimeout(pollTimer);pollTimer=setTimeout(loadReminders,10000)}
function render(data){var groups=['School','Extracurricular','Other'];var html='';for(var i=0;i<groups.length;i++){var g=groups[i],rows=[];for(var id in data){if(Object.prototype.hasOwnProperty.call(data,id)&&data[id]&&data[id].category===g)rows.push(data[id])}rows.sort(function(a,b){var da=a.due||'9999',db=b.due||'9999';return da<db?-1:da>db?1:(a.created||0)-(b.created||0)});if(rows.length){html+='<section class="group '+g+'"><h2>'+g+'</h2>';for(var j=0;j<rows.length;j++){var r=rows[j];html+='<div class="item"><span class="dot"><span></span></span><span class="content">'+escapeHtml(r.title)+(r.details?'<small>'+escapeHtml(r.details)+'</small>':'')+(r.due?'<small>Due: '+escapeHtml(r.due)+'</small>':'')+'</span></div>'}html+='</section>'}}el('board').innerHTML=html||'<p style="text-align:center;color:#777;margin-top:65px">No reminders yet.</p>'}
function logout(){accessToken='';refreshToken='';try{localStorage.removeItem('tv_refresh_token')}catch(e){}if(pollTimer)clearTimeout(pollTimer);el('board').innerHTML='';showLogin('')}
function tick(){var d=new Date();try{el('clock').textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'Asia/Dubai'});el('date').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Dubai'})}catch(e){el('clock').textContent=d.toLocaleTimeString();el('date').textContent=d.toDateString()}}
tick();setInterval(tick,15000);try{refreshToken=localStorage.getItem('tv_refresh_token')||''}catch(e){}if(refreshToken)refresh();else showLogin('');
</script></body></html>
