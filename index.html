<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reminder Board</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f5f5f5;background:#101113}*{box-sizing:border-box}body{margin:0}main{max-width:1250px;margin:auto;padding:5vw 5vw 80px}.top{text-align:center;padding:3vh 0 6vh;border-bottom:1px solid #333}#clock{font-size:clamp(65px,11vw,155px);font-weight:300;letter-spacing:-.065em;font-variant-numeric:tabular-nums}#date{font-size:clamp(20px,2.8vw,35px);color:#a5a5a5;margin-top:10px}.group{margin-top:42px}.group h2{font-size:clamp(15px,1.5vw,22px);font-weight:500;letter-spacing:.14em;color:#a3a3a3;text-transform:uppercase;margin:0 0 13px}.item{display:flex;align-items:center;gap:15px;border-top:1px solid #303135;padding:19px 2px;font-size:clamp(19px,2.3vw,31px)}.item:last-child{border-bottom:1px solid #303135}.item .content{flex:1;min-width:0;overflow-wrap:anywhere}.item small{display:block;color:#999;font-size:.56em;margin-top:6px}.dot{width:9px;height:9px;border-radius:50%;background:#888;flex:none}.School .dot{background:#80adff}.Extracurricular .dot{background:#92d6b0}.Other .dot{background:#f0c38a}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:18px 0}.controls button,dialog button{border:1px solid #444;background:#22252a;color:white;border-radius:9px;padding:11px 15px;cursor:pointer;font:inherit}.controls button:hover,dialog button:hover{background:#35393f}button.primary{background:#f2f2f2;color:#111;border-color:#f2f2f2}.edit{font-size:13px!important;padding:8px 11px!important}.hidden{display:none!important}#status{text-align:center;color:#999;font-size:12px;margin:10px 0}dialog{background:#1b1d21;color:white;border:1px solid #444;border-radius:14px;padding:25px;width:min(440px,calc(100% - 24px))}dialog::backdrop{background:#000b}dialog h2{margin-top:0}label{display:block;font-size:14px;color:#aaa;margin:16px 0}input,select,textarea{display:block;width:100%;margin-top:7px;padding:12px;background:#101113;border:1px solid #555;border-radius:8px;color:white;font:inherit;font-size:16px}textarea{min-height:80px;resize:vertical}.dialog-buttons{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}#loginBox{max-width:440px;margin:45px auto;padding:20px;border:1px solid #444;border-radius:12px}#loginBox h2{margin-top:0}#loginBox p{color:#aaa;font-size:14px;line-height:1.5}#loginError{color:#ffa8a8;font-size:13px}body.tv .controls,body.tv .edit,body.tv #status,body.tv #loginBox{display:none!important}body.tv main{max-width:1600px}@media(max-width:600px){main{padding:20px 20px 60px}.top{padding:20px 0 30px}.group{margin-top:30px}.item{padding:17px 0}}
</style></head><body><main><div class="top"><div id="clock">--:--</div><div id="date">Loading…</div></div><div class="controls" id="controls"><button id="add" class="primary" disabled>+ Add reminder</button><button id="tv">TV mode</button><button id="logout" class="hidden">Sign out</button></div><div id="status">Connecting…</div><section id="loginBox"><h2>Sign in to edit</h2><p>Sign in with your Firebase account. Your TV can stay in display mode after signing in once.</p><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="login" class="primary">Sign in</button><p id="loginError"></p></section><div id="board"></div></main>
<dialog id="modal"><form id="form"><h2 id="modalTitle">Add reminder</h2><label>Reminder<input id="title" required maxlength="160"></label><label>Category<select id="category"><option>School</option><option>Extracurricular</option><option>Other</option></select></label><label>Details (optional)<textarea id="details" maxlength="500"></textarea></label><label>Due date (optional)<input id="due" type="date"></label><div class="dialog-buttons"><button type="button" id="delete" class="hidden">Delete</button><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<script type="module">
// REPLACE ONLY THE firebaseConfig VALUES WITH YOUR FIREBASE WEB APP CONFIG.
const firebaseConfig = {
  "apiKey": "AIzaSyBe2n9ntumyY24juQQhccV-kuYuHr-b0o4",
  "authDomain": "minimal-reminder-board.firebaseapp.com",
  "databaseURL": "https://minimal-reminder-board-default-rtdb.asia-southeast1.firebasedatabase.app",
  "projectId": "minimal-reminder-board",
  "storageBucket": "minimal-reminder-board.firebasestorage.app",
  "messagingSenderId": "768906171767",
  "appId": "1:768906171767:web:e5319601c1c7a06da53d72",
  "measurementId": "G-NBZ0XK9XQ5"
};
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,onValue,push,set,remove} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const $=id=>document.getElementById(id), app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
let entries={},editId=null,unsubscribe=null,user=null;
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tick(){let n=new Date();$('clock').textContent=n.toLocaleTimeString('en-AE',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'Asia/Dubai'});$('date').textContent=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Dubai'});}tick();setInterval(tick,15000);
function render(){let groups=['School','Extracurricular','Other'];$('board').innerHTML=groups.map(g=>{let rows=Object.entries(entries).filter(([,r])=>r.category===g).sort((a,b)=>(a[1].due||'9999').localeCompare(b[1].due||'9999')||(a[1].created||0)-(b[1].created||0));if(!rows.length)return '';return `<section class="group ${g}"><h2>${g}</h2>${rows.map(([id,r])=>`<div class="item"><span class="dot"></span><span class="content">${escapeHTML(r.title)}${r.details?`<small>${escapeHTML(r.details)}</small>`:''}${r.due?`<small>Due: ${escapeHTML(r.due)}</small>`:''}</span>${user?`<button class="edit" data-id="${escapeHTML(id)}">Edit</button>`:''}</div>`).join('')}</section>`}).join('')||'<p style="color:#777;text-align:center;margin-top:65px">No reminders yet.</p>';document.querySelectorAll('.edit').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.id)));}
function openModal(id=null){editId=id;let r=id?entries[id]:null;$('modalTitle').textContent=r?'Edit reminder':'Add reminder';$('title').value=r?.title||'';$('category').value=r?.category||'School';$('details').value=r?.details||'';$('due').value=r?.due||'';$('delete').classList.toggle('hidden',!r);$('modal').showModal();}
$('add').onclick=()=>openModal();$('cancel').onclick=()=>$('modal').close();$('form').onsubmit=async e=>{e.preventDefault();if(!user)return;let data={title:$('title').value.trim(),category:$('category').value,details:$('details').value.trim(),due:$('due').value,created:editId?entries[editId].created||Date.now():Date.now()};if(!data.title)return;try{await set(editId?ref(db,'boards/main/reminders/'+editId):push(ref(db,'boards/main/reminders')),data);$('modal').close()}catch(err){alert('Save failed: '+err.message)}};
$('delete').onclick=async()=>{if(editId&&confirm('Delete this reminder?')){try{await remove(ref(db,'boards/main/reminders/'+editId));$('modal').close()}catch(err){alert(err.message)}}};
$('tv').onclick=()=>{document.body.classList.toggle('tv');$('tv').textContent=document.body.classList.contains('tv')?'Exit TV mode':'TV mode';};
$('login').onclick=async()=>{try{$('loginError').textContent='';await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('loginError').textContent='Could not sign in. Check your email, password, and Firebase Authentication settings.'}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{user=u;if(unsubscribe){unsubscribe();unsubscribe=null}entries={};$('loginBox').classList.toggle('hidden',!!u);$('logout').classList.toggle('hidden',!u);$('add').disabled=!u;$('status').textContent=u?'Live sync connected':'Sign in to load your private reminders';if(u){unsubscribe=onValue(ref(db,'boards/main/reminders'),s=>{entries=s.val()||{};render();$('status').textContent='Live sync connected';},e=>{$('status').textContent='Database error: '+e.message})}render()});
</script></body></html>
